[env:crowpanel_28_transmitter]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
lib_deps = lovyan03/LovyanGFX@1.2.25
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; 1 = CSI receiver (STA), 0 = traffic transmitter/AP
    -DNODE_ROLE_SENSOR=0
    -DCROWPANEL_MODEL=28
