esphome:
  name: advance-hmi-28-24-led
  friendly_name: Advance_HMI_28_24_LED
  platformio_options:
     build_flags: "-DBOARD_HAS_PSRAM"
     board_build.esp-idf.memory_type: qio_opi
     board_build.flash_mode: dio
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz 

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "bJRui9I7xi5teMQ0r2o+W/YtfKc2ifbdS0HsBblMVm8="

ota:
  - platform: esphome
    password: "b8f9338a0ec4bcbbe3135fd6b5eab29d"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "yanfa_software"
    password: "yanfa-123456"

captive_portal:
output:
  - platform: ledc
    pin: GPIO38
    inverted: False
    id: backlight_pwm

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%

image:
  - file: "small_hum.png"
    id: small_hum
    resize: 50x75
    type: RGB565
  - file: "small_logo.png"
    id: small_logo
    resize: 200x200
    type: RGB565
    transparency: chroma_key
  - file: "small_temp.png"
    id: small_temp
    resize: 50x75
    type: RGB565

i2c:
  sda: 17
  scl: 18
  scan: true

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Room Temperature"
      id: room_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1
    humidity:
      name: "Room Humidity"
      id: room_hum
      unit_of_measurement: "%"
      accuracy_decimals: 1
    update_interval: 1s

spi:
  clk_pin: 42
  mosi_pin: 39
display:
  - platform: st7789v
    id: main_display
    model: Custom 
    height: 320
    offset_height: 0
    width: 240
    offset_width: 0
    rotation: 90
    cs_pin: GPIO40
    dc_pin: GPIO41
    reset_pin: GPIO3
     
        

lvgl:
  log_level: INFO
  color_depth: 16
  bg_color: 0xFFFFFF
  
  text_font: montserrat_14
  widgets:
    - image:
        id: lvgl_logo
        src: small_logo
        x: 25
        y: 10
    - image:
        id: lvgl_temp
        src: small_temp
        x: 50
        y: 125
    - image:
        id: lvgl_hum
        src: small_hum
        x: 200
        y: 125

    - label:
        id: label_temp
        x: 30
        y: 200
        text: "Temp: --°C"
    - label:
        id: label_hum
        x: 180
        y: 200
        text: "Humi: --%"


interval:
  - interval: 1s
    then:
      - lambda: |-
          char temp_str[20];
          char hum_str[20];
          snprintf(temp_str, sizeof(temp_str), "Temp: %.1f°C", id(room_temp).state);
          snprintf(hum_str, sizeof(hum_str), "Humi: %.1f%%", id(room_hum).state);
          lv_label_set_text(id(label_temp), temp_str);
          lv_label_set_text(id(label_hum), hum_str);    